<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Big Pay Whish — Customer Display (T6D)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/customer-display.css" />
  <style>
    .toolbar {
      position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 20;
      display: flex; align-items: center; gap: 8px;
      padding: 6px; border-radius: 999px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
    }
    .toolbar button {
      padding: 8px 16px; border-radius: 999px; cursor: pointer;
      background: transparent; border: none; color: rgba(255,255,255,0.6);
      font: 600 13px 'Manrope', sans-serif; white-space: nowrap;
    }
    .toolbar button.on { background: #18a4e8; color: #fff; }
    .controls { position: fixed; top: 72px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; gap: 8px; }
    .stage:not(.embedded) { padding-top: 130px; }
    .csaver-batt { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; color: #ff8a9a; background: rgba(241,82,104,0.16); border: 1px solid rgba(241,82,104,0.4); padding: 8px 15px; border-radius: 999px; z-index: 5; white-space: nowrap; animation: cBattPulse 1.8s ease-in-out infinite; }
    @keyframes cBattPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(241,82,104,0.35); } 50% { box-shadow: 0 0 0 8px rgba(241,82,104,0); } }
    .csaver.light .csaver-batt { color: #c8253e; background: rgba(241,82,104,0.12); border-color: rgba(241,82,104,0.45); }
    .stage.embedded { padding: 0; background: #000; }
    .stage.embedded .device { width: 760px; height: 460px; border-radius: 0; padding: 0; box-shadow: none; transform: scale(var(--fit, 1)); transform-origin: center; }
    .stage.embedded .device::after { display: none; }
    .stage.embedded .csaver { inset: 0; border-radius: 0; }
    .themebtn {
      position: fixed; top: 18px; right: 18px; z-index: 20;
      display: flex; align-items: center; gap: 9px; cursor: pointer;
      padding: 7px 14px 7px 8px; border-radius: 999px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.78); font: 600 13px 'Manrope', sans-serif;
    }
    .themebtn .knob { width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,0.14); display: grid; place-items: center; }
  </style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#0a0f1d"/>
      <rect x="16" y="34" width="68" height="40" rx="6" fill="#101730" stroke="#18a4e8" stroke-width="1.5"/>
      <rect x="44" y="44" width="5" height="16" rx="2" fill="#fff" transform="skewX(-9)"/>
      <rect x="50" y="50" width="8" height="10" rx="2" fill="#18a4e8" transform="skewX(-9)"/>
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  
  <script src="src/logo-assets.js"></script>
  <script>window.BP_VARIANT = 'whish'; window.BP_PARTNER = { id: 'whish', name: 'WHISH MONEY', logo: window.BP_LOGO_WHISH, pill: false };</script>

  <script type="text/babel">
    const { useState } = React;
    const PARTNER = window.BP_PARTNER || null;
    const MERCHANT = PARTNER ? PARTNER.name : 'Breidy Naturals';
    const PartnerLogo = ({ h }) => PARTNER ? <img src={PARTNER.logo} alt="" style={{ height: h, width: 'auto', borderRadius: PARTNER.pill ? 999 : Math.round(h * 0.28), flexShrink: 0, display: 'block' }} /> : null;
    const AMOUNT = '$24.50';
    const AMOUNT_LBP = '2,192,750 LBP';

    function BrandTile({ size }) {
      const r = size * 0.28;
      return (
        <div style={{
          width: size, height: size, borderRadius: r, position: 'relative',
          background: 'linear-gradient(150deg, #0a0f1d, #16264d)', flexShrink: 0,
          overflow: 'hidden', boxShadow: '0 6px 22px -4px rgba(24,164,232,0.6)',
        }}>
          <div style={{ position: 'absolute', left: '26%', top: '16%', width: '20%', height: '60%', background: '#fff', borderRadius: size * 0.08, transform: 'skewX(-9deg)' }} />
          <div style={{ position: 'absolute', left: '46%', top: '30%', width: '30%', height: '40%', background: '#18a4e8', borderRadius: size * 0.08, transform: 'skewX(-9deg)' }} />
        </div>
      );
    }

    /* animated background shared by every state */
    const DOTS = [
      { left: '14%', top: '26%', d: '0s' }, { left: '82%', top: '32%', d: '1.2s' },
      { left: '24%', top: '70%', d: '2.1s' }, { left: '74%', top: '66%', d: '0.7s' },
      { left: '50%', top: '20%', d: '1.7s' }, { left: '88%', top: '52%', d: '2.7s' },
      { left: '10%', top: '50%', d: '3.1s' }, { left: '62%', top: '80%', d: '0.4s' },
    ];
    function Backdrop({ rings }) {
      return (
        <React.Fragment>
          <div className="csaver-aurora" />
          <div className="csaver-grid" />
          <div className="csaver-dots">
            {DOTS.map((p, i) => <i key={i} style={{ left: p.left, top: p.top, animationDelay: p.d }} />)}
          </div>
          {rings && <div className="csaver-rings"><span /><span /><span /></div>}
        </React.Fragment>
      );
    }
    function TopStrip({ dark }) {
      return (
        <div className="cd-top">
          <div className="cd-brand">
            <img src={dark ? window.BP_WORD_DARK : window.BP_WORD} alt="Big Pay" style={{ height: 62, width: 'auto', display: 'block' }} />
          </div>
          <span className="cd-merchant" style={{ display: 'flex', alignItems: 'center', gap: 9 }}><PartnerLogo h={24} />{MERCHANT}</span>
        </div>
      );
    }

    /* ---- SCREENSAVER ---- */
    function Screensaver({ online, dark, battery = 86 }) {
      const lowBatt = battery <= 25;
      return (
        <React.Fragment>
          <Backdrop rings />
          <div className="csaver-center">
            <img src={dark ? window.BP_LOGO_DARK : window.BP_LOGO} alt="Big Pay" style={{ width: 440, maxWidth: '60vw', height: 'auto', display: 'block' }} />
          </div>
          <div className="csaver-foot">
            <span className="csaver-merchant" style={{ display: 'flex', alignItems: 'center', gap: 9 }}><PartnerLogo h={26} />{MERCHANT}</span>
            <span className="csaver-sep" />
            <span className="csaver-online"><span className={'dot' + (online ? '' : ' off')} /> {online ? 'Ready To Serve You' : 'Terminal Offline'}</span>
          </div>
          {lowBatt && (
            <div className="csaver-batt">
              <svg width="22" height="12" viewBox="0 0 22 12"><rect x="0.75" y="0.75" width="17.5" height="10.5" rx="2.6" fill="none" stroke="currentColor" strokeWidth="1.5" /><rect x="2.5" y="2.5" width={Math.max(1.5, Math.round(14 * battery / 100))} height="7" rx="1.4" fill="currentColor" /><rect x="19.5" y="3.5" width="2" height="5" rx="1" fill="currentColor" opacity="0.6" /></svg>
              Low Battery · <span className="num" style={{ letterSpacing: 0 }}>{battery + '%'}</span> — Please Connect Charger
            </div>
          )}
        </React.Fragment>
      );
    }

    /* ---- AMOUNT DUE ---- */
    function Amount({ dark }) {
      return (
        <React.Fragment>
          <Backdrop />
          <TopStrip dark={dark} />
          <div className="cd-body">
            <div className="cd-label">Amount Due</div>
            <div className="cd-amount num" style={{ fontSize: 110 }}><span className="cur">$</span>24.50</div>
            <div className="cd-hint">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 8.5a9 9 0 0 1 12 0M9 12a4.5 4.5 0 0 1 6 0" /><circle cx="12" cy="16" r="1.4" fill="currentColor" stroke="none" /></svg>
              Tap, Insert, Swipe or Scan to Pay
            </div>
          </div>
        </React.Fragment>
      );
    }

    /* ---- PROCESSING ---- */
    function Processing({ dark }) {
      return (
        <React.Fragment>
          <Backdrop />
          <TopStrip dark={dark} />
          <div className="cd-body">
            <svg className="cd-spinner" viewBox="0 0 100 100"><circle className="track" cx="50" cy="50" r="42" /><circle className="head" cx="50" cy="50" r="42" /></svg>
            <div className="cd-title" style={{ fontSize: 38, marginTop: 30 }}>Processing Payment</div>
            <div className="cd-sub">Please Wait</div>
            <div className="cd-dots3"><i /><i /><i /></div>
          </div>
        </React.Fragment>
      );
    }

    /* ---- DECLINED ---- */
    function Declined({ dark }) {
      return (
        <React.Fragment>
          <Backdrop />
          <TopStrip dark={dark} />
          <div className="cd-body">
            <div className="cd-badge bad">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M17 7 7 17M7 7l10 10" /></svg>
            </div>
            <div className="cd-title" style={{ color: 'var(--red)' }}>Declined</div>
            <div className="cd-sub">Payment Not Approved · Please Try Again</div>
          </div>
        </React.Fragment>
      );
    }

    /* ---- COMPLETED ---- */
    function Completed({ dark }) {
      return (
        <React.Fragment>
          <Backdrop />
          <TopStrip dark={dark} />
          <div className="cd-body">
            <div className="cd-badge ok">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
            </div>
            <div className="cd-title" style={{ color: 'var(--green)' }}>Payment Received</div>
            <div className="cd-result-amt num" style={{ fontSize: 58 }}>{AMOUNT}</div>
            <div className="cd-sub" style={{ marginTop: 14, fontWeight: 700, letterSpacing: '0.02em' }}>Thank You!</div>
          </div>
        </React.Fragment>
      );
    }

    /* ---- RECEIPT QR — customer scans to download receipt ---- */
    function FauxQR({ size = 184, fg = '#0b0f1c', bg = '#fff' }) {
      const n = 21, cell = size / (n + 4), pad = cell * 2, cells = [];
      const seed = (i, j) => ((i * 73856093) ^ (j * 19349663) ^ ((i + 3) * (j + 7) * 83492791)) >>> 0;
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
        const finder = (i < 7 && j < 7) || (i < 7 && j >= n - 7) || (i >= n - 7 && j < 7);
        if (!finder && seed(i, j) % 100 < 47) cells.push(<rect key={i + '-' + j} x={pad + j * cell} y={pad + i * cell} width={cell * 0.92} height={cell * 0.92} rx={cell * 0.18} fill={fg} />);
      }
      const F = ({ x, y }) => (<g><rect x={pad + x * cell} y={pad + y * cell} width={cell * 7} height={cell * 7} rx={cell * 1.4} fill={fg} /><rect x={pad + (x + 1) * cell} y={pad + (y + 1) * cell} width={cell * 5} height={cell * 5} rx={cell} fill={bg} /><rect x={pad + (x + 2) * cell} y={pad + (y + 2) * cell} width={cell * 3} height={cell * 3} rx={cell * 0.7} fill={fg} /></g>);
      return (<svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ borderRadius: 18, background: bg, display: 'block' }}>{cells}<F x={0} y={0} /><F x={n - 7} y={0} /><F x={0} y={n - 7} /></svg>);
    }
    function ReceiptQR({ dark }) {
      return (
        <React.Fragment>
          <Backdrop />
          <div className="cd-body" style={{ justifyContent: 'center', alignItems: 'center', padding: 0, inset: 0 }}>
            <div style={{ padding: 14, background: '#fff', borderRadius: 26, boxShadow: '0 16px 50px -12px rgba(24,164,232,0.35)', display: 'grid', placeItems: 'center' }}>
              <FauxQR size={340} />
            </div>
          </div>
        </React.Fragment>
      );
    }

    /* ---- WALLET PAYMENT QR — mirrored full-screen for the customer to scan ---- */
    function WalletQR({ dark }) {
      return (
        <React.Fragment>
          <Backdrop />
          <div className="cd-body" style={{ justifyContent: 'center', alignItems: 'center', padding: 0, inset: 0 }}>
            <div style={{ padding: 14, background: '#fff', borderRadius: 26, boxShadow: '0 16px 50px -12px rgba(24,164,232,0.35)', display: 'grid', placeItems: 'center' }}>
              <FauxQR size={340} />
            </div>
          </div>
        </React.Fragment>
      );
    }

    const SCREENS = [
      { id: 'saver', label: 'Screensaver', C: Screensaver },
      { id: 'amount', label: 'Amount', C: Amount },
      { id: 'processing', label: 'Processing', C: Processing },
      { id: 'declined', label: 'Declined', C: Declined },
      { id: 'completed', label: 'Completed', C: Completed },
      { id: 'receiptqr', label: 'Receipt QR', C: ReceiptQR },
      { id: 'walletqr', label: 'Wallet QR', C: WalletQR },
    ];

    function readHash() {
      const h = (location.hash || '').replace(/^#\/?/, '');
      const [id, q] = h.split('?');
      const p = new URLSearchParams(q || '');
      return { id: SCREENS.some(s => s.id === id) ? id : null, theme: p.get('theme'), batt: p.get('batt') ? Number(p.get('batt')) : null };
    }
    function App() {
      const init = readHash();
      const embedded = !!init.id;
      const [dark, setDark] = useState(init.theme ? init.theme === 'dark' : true);
      const [online, setOnline] = useState(true);
      const [battery, setBattery] = useState(init.batt != null ? init.batt : 86);
      const [screen, setScreen] = useState(init.id || 'saver');
      React.useEffect(() => {
        const fn = () => { const h = readHash(); if (h.id) setScreen(h.id); if (h.theme) setDark(h.theme === 'dark'); setBattery(h.batt != null ? h.batt : 86); };
        window.addEventListener('hashchange', fn); return () => window.removeEventListener('hashchange', fn);
      }, []);
      React.useEffect(() => {
        if (!embedded) return;
        const fit = () => document.documentElement.style.setProperty('--fit', String(Math.min(window.innerWidth / 760, window.innerHeight / 460)));
        fit(); window.addEventListener('resize', fit); return () => window.removeEventListener('resize', fit);
      }, [embedded]);
      const Active = SCREENS.find(s => s.id === screen).C;
      return (
        <React.Fragment>
          {!embedded && <div className="toolbar">
            {SCREENS.map(s => (
              <button key={s.id} className={screen === s.id ? 'on' : ''} onClick={() => setScreen(s.id)}>{s.label}</button>
            ))}
          </div>}

          {!embedded && <div className="controls">
            {screen === 'saver' && (
              <button className="themebtn" style={{ position: 'static' }} onClick={() => setOnline(o => !o)}>
                <span className="knob" style={{ background: online ? 'rgba(46,204,143,0.22)' : 'rgba(240,80,107,0.22)' }}>
                  <span style={{ width: 8, height: 8, borderRadius: '50%', background: online ? '#2ecc8f' : '#f0506b' }} />
                </span>
                {online ? 'Online' : 'Offline'}
              </button>
            )}
            {screen === 'saver' && (
              <button className="themebtn" style={{ position: 'static' }} onClick={() => setBattery(b => b <= 25 ? 86 : 22)}>
                <span className="knob" style={{ background: battery <= 25 ? 'rgba(240,80,107,0.22)' : 'rgba(255,255,255,0.14)' }}><span style={{ width: 8, height: 8, borderRadius: '50%', background: battery <= 25 ? '#f0506b' : '#2ecc8f' }} /></span>
                Battery {battery}%
              </button>
            )}
            <button className="themebtn" style={{ position: 'static' }} onClick={() => setDark(d => !d)}>
              <span className="knob">
                {dark
                  ? <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z" /></svg>
                  : <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4.2" /><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M5 5l1.7 1.7M17.3 17.3 19 19M19 5l-1.7 1.7M6.7 17.3 5 19" /></svg>}
              </span>
              {dark ? 'Dark' : 'Light'}
            </button>
          </div>}

          <div className={'stage' + (embedded ? ' embedded' : '')}>
            <div className="device">
              <div className={'csaver' + (dark ? '' : ' light')}>
                <Active online={online} dark={dark} battery={battery} />
              </div>
            </div>
          </div>
          {!embedded && <div className="caption">TOPWISE T6D · customer-facing second screen</div>}
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
